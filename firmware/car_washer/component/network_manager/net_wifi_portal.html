<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cấu hình WiFi</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#14181f;--mut:#667085;--ln:#e4e7ec;--pri:#0b6bcb;--pri-tx:#fff;--ok:#12805c;--ok-bg:#e7f6ef;--err:#c4320a;--err-bg:#fdeee8;--warn-bg:#fff6e0;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#181c23;--tx:#e8ebf0;--mut:#98a2b3;--ln:#2a303a;--pri:#4a9cf0;--pri-tx:#06121f;--ok:#4cc79a;--ok-bg:#12271f;--err:#f0886a;--err-bg:#2d1a14;--warn-bg:#2a2210;--warn:#e5b54a}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 32px}
header{padding:8px 2px 16px}
h1{font-size:21px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-bottom:14px;overflow:hidden}
.st{padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.st dt{color:var(--mut)}
.st dd{text-align:right;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--mut)}
.dot.on{background:var(--ok)}.dot.off{background:var(--err)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln)}
.hd h2{font-size:15px;font-weight:620}
.btn{appearance:none;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;padding:11px 16px;background:var(--pri);color:var(--pri-tx);min-height:44px}
.btn:disabled{opacity:.55;cursor:default}
.btn.gh{background:transparent;color:var(--pri);padding:8px 10px;min-height:36px}
.btn.full{width:100%}
.btn.danger{background:var(--err);color:#fff}
.note{font-size:13px;color:var(--mut);margin:2px 0 10px}
.note.w{color:var(--err)}
ul{list-style:none}
li{border-bottom:1px solid var(--ln)}
li:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:52px}
.row:active{background:var(--bg)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:520}
.cur{font-size:12px;color:var(--ok);font-weight:600;margin-left:6px}
.ic{flex:none;color:var(--mut);display:flex;gap:6px;align-items:center}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.bars i{width:3px;background:var(--ln);border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:14px}
.bars i.f{background:var(--tx)}
.fm{padding:0 16px 14px;display:none}
li.open .fm{display:block}
label{display:block;font-size:13px;color:var(--mut);margin:2px 0 6px}
.pw{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);min-height:44px}
input:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.eye{flex:none;width:44px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.msg{padding:12px 16px;font-size:14px;border-radius:12px;margin-bottom:14px;display:none}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.msg.err{display:block;background:var(--err-bg);color:var(--err)}
.msg.inf{display:block;background:var(--warn-bg);color:var(--warn)}
.msg b{display:block;margin-bottom:2px}
.empty{padding:22px 16px;text-align:center;color:var(--mut);font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}
.hid{padding:12px 16px}
.hid .fm{display:block;padding:0}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
.demo{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cấu hình WiFi</h1>
    <div class="sub">Tủ điều khiển rửa xe · <span id="mac">—</span></div>
  </header>

  <div class="demo" id="demo">Đang xem thử: dữ liệu giả lập, không kết nối với tủ.</div>
  <div class="msg" id="msg"></div>

  <section class="card">
    <dl class="st">
      <dt>Mạng đang dùng</dt><dd id="s-net">—</dd>
      <dt>WiFi</dt><dd id="s-wifi">—</dd>
      <dt>Địa chỉ IP</dt><dd id="s-ip">—</dd>
      <dt>Máy chủ</dt><dd id="s-srv">—</dd>
    </dl>
  </section>

  <section class="card">
    <div class="hd">
      <h2>Mạng WiFi xung quanh</h2>
      <button class="btn gh" id="scan">Quét lại</button>
    </div>
    <ul id="list"><li class="empty"><span class="spin"></span>&nbsp; Đang quét…</li></ul>
  </section>

  <section class="card">
    <div class="hd"><h2>Mạng ẩn</h2></div>
    <div class="hid">
      <div class="fm">
        <label for="h-ssid">Tên WiFi (SSID)</label>
        <div class="pw"><input id="h-ssid" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32"></div>
        <label for="h-pw">Mật khẩu</label>
        <div class="pw"><input id="h-pw" type="password" autocomplete="off" maxlength="64"><button class="eye" type="button" data-for="h-pw">Hiện</button></div>
        <button class="btn full" id="h-go">Kết nối</button>
      </div>
    </div>
  </section>

  <div class="foot">Sau khi kết nối thành công, bạn có thể ngắt WiFi của tủ.<br>Phiên bản <span id="fw">—</span></div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var DEMO=false, busy=false, cur=null;

/* ---------- du lieu gia lap khi mo file truc tiep ---------- */
var D={st:{mac:"80456b281774",fw:"V1.0.0",net:"wifi",ssid:"Lâm Hoàng",connected:true,ip:"172.20.10.2",rssi:-62,server:true,other:"eth"},
 aps:[{ssid:"Lâm Hoàng",rssi:-58,auth:3},{ssid:"Cafe Sân Vườn",rssi:-67,auth:3},{ssid:"VNPT_5G_A21",rssi:-71,auth:3},{ssid:"Viettel-Home",rssi:-80,auth:4},{ssid:"Wifi Free",rssi:-84,auth:0}]};
function demo(path,body){return new Promise(function(ok,no){setTimeout(function(){
 if(path=="/api/status")return ok(D.st);
 if(path=="/api/scan")return ok(D.aps);
 if(path=="/api/connect"){if(body.password=="sai"){D.st.connected=false;D.st.ssid=body.ssid;D.st.ip="";D.st.err="AUTH_FAIL";}
  else{D.st={mac:D.st.mac,fw:D.st.fw,net:"wifi",ssid:body.ssid,connected:true,ip:"192.168.1.37",rssi:-60,server:true,other:"eth"};}
  return ok({ok:true});}
 if(path=="/api/forget"){D.st={mac:D.st.mac,fw:D.st.fw,net:D.st.other||"none",ssid:"",connected:false,ip:"",server:!!D.st.other,other:D.st.other};return ok({ok:true});}
 no();},path=="/api/scan"?900:250)})}

function api(path,body){
 if(DEMO)return demo(path,body);
 var c=new AbortController(),t=setTimeout(function(){c.abort()},path=="/api/scan"?12000:5000);
 return fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:c.signal}:{signal:c.signal})
  .then(function(r){clearTimeout(t);if(!r.ok)throw r.status;return r.json()});
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
function lvl(r){return r>=-55?4:r>=-65?3:r>=-75?2:1}
function bars(r){var n=lvl(r),h='<span class="bars" aria-label="Sóng '+n+'/4">';for(var i=1;i<=4;i++)h+='<i'+(i<=n?' class="f"':'')+'></i>';return h+'</span>'}
var LOCK='<svg width="13" height="13" viewBox="0 0 16 16" aria-label="Có mật khẩu"><path fill="currentColor" d="M4 7V5a4 4 0 1 1 8 0v2h.5A1.5 1.5 0 0 1 14 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-5A1.5 1.5 0 0 1 3.5 7H4zm2 0h4V5a2 2 0 1 0-4 0v2z"/></svg>';
var NET={wifi:"WiFi",eth:"Ethernet","4g":"4G",none:"Chưa có mạng"};
var OTHER={eth:"Ethernet","4g":"4G",wifi:"WiFi"};

function msg(cls,title,text){var m=$("msg");m.className="msg "+cls;m.innerHTML=(title?"<b>"+esc(title)+"</b>":"")+esc(text||"");if(cls)m.scrollIntoView({block:"nearest"})}
function clr(){$("msg").className="msg"}

function showSt(s){
 cur=s;
 $("mac").textContent=(s.mac||"").toUpperCase().replace(/(..)(?!$)/g,"$1:");
 $("fw").textContent=s.fw||"—";
 var n=s.net||"none";
 $("s-net").innerHTML='<span class="dot '+(n=="none"?"off":"on")+'"></span>'+esc(NET[n]||n);
 $("s-wifi").textContent=s.ssid?(s.ssid+(s.connected?"":" (chưa kết nối)")):"Chưa cài đặt";
 $("s-ip").textContent=s.ip||"—";
 $("s-srv").innerHTML='<span class="dot '+(s.server?"on":"off")+'"></span>'+(s.server?"Đã kết nối":"Chưa kết nối");
}

function render(aps){
 var seen={},L=[];
 aps.forEach(function(a){if(!a.ssid)return;if(!seen[a.ssid]||seen[a.ssid].rssi<a.rssi)seen[a.ssid]=a});
 for(var k in seen)L.push(seen[k]);
 L.sort(function(a,b){return b.rssi-a.rssi});
 if(!L.length){$("list").innerHTML='<li class="empty">Không tìm thấy mạng WiFi nào. Bấm “Quét lại”.</li>';return}
 $("list").innerHTML=L.map(function(a,i){
  var on=cur&&cur.connected&&cur.ssid==a.ssid;
  return '<li data-i="'+i+'"><button class="row" type="button"><span class="nm">'+esc(a.ssid)+(on?'<span class="cur">Đang dùng</span>':'')+'</span><span class="ic">'+(a.auth?LOCK:'')+bars(a.rssi)+'</span></button>'+
   '<div class="fm">'+(on?'<p class="note">Tủ đang dùng mạng này. Ngắt kết nối sẽ xoá mạng khỏi danh sách đã lưu, tủ không tự kết nối lại.</p><button class="btn full danger off" type="button">Ngắt kết nối</button>':
   (a.auth?'<label for="pw'+i+'">Mật khẩu</label><div class="pw"><input id="pw'+i+'" type="password" autocomplete="off" maxlength="64"><button class="eye" type="button" data-for="pw'+i+'">Hiện</button></div>':'<label>Mạng không có mật khẩu</label>')+
   '<button class="btn full go" type="button">Kết nối</button>')+'</div></li>';
 }).join("");
 $("list").L=L;
}

function scan(){
 if(busy)return;
 $("scan").disabled=true;$("scan").innerHTML='<span class="spin"></span>';
 api("/api/scan").then(render).catch(function(){$("list").innerHTML='<li class="empty">Không quét được. Thử “Quét lại”.</li>'})
  .then(function(){$("scan").disabled=false;$("scan").textContent="Quét lại"});
}

function connect(ssid,pw,btn){
 if(busy)return;
 if(!ssid){msg("err","Thiếu tên WiFi","");return}
 if(pw&&pw.length<8){msg("err","Mật khẩu quá ngắn","Mật khẩu WiFi tối thiểu 8 ký tự.");return}
 busy=true;var old=btn.textContent;btn.disabled=true;btn.innerHTML='<span class="spin"></span>&nbsp; Đang kết nối…';
 msg("inf","Đang kết nối “"+ssid+"”…","Có thể mất tới 20 giây. Điện thoại có thể tự rớt WiFi của tủ trong lúc này, chờ một chút rồi kết nối lại.");
 var t0=Date.now();
 function done(){busy=false;btn.disabled=false;btn.textContent=old}
 function poll(){
  api("/api/status").then(function(s){
   showSt(s);
   if(s.ssid==ssid&&s.connected&&s.ip){done();msg("ok","Đã kết nối “"+ssid+"”","Địa chỉ IP: "+s.ip+(s.server?". Tủ đã kết nối máy chủ.":". Đang kết nối máy chủ…"));scan();return}
   if(s.err=="AUTH_FAIL"){done();msg("err","Sai mật khẩu","Kiểm tra lại mật khẩu WiFi “"+ssid+"”.");return}
   if(s.err=="NO_AP"){done();msg("err","Không tìm thấy mạng","WiFi “"+ssid+"” không có trong vùng phủ sóng.");return}
   if(s.err=="FAIL"){done();msg("err","Không kết nối được","Kiểm tra tên, mật khẩu và vị trí phát WiFi rồi thử lại.");return}
   next();
  }).catch(next);
 }
 function next(){if(Date.now()-t0>25000){done();msg("err","Không kết nối được","Kiểm tra tên, mật khẩu và vị trí phát WiFi rồi thử lại.");return}setTimeout(poll,1500)}
 api("/api/connect",{ssid:ssid,password:pw||""}).then(function(r){if(r&&r.ok===false){done();msg("err","Không kết nối được",r.msg||"");return}setTimeout(poll,2000)}).catch(function(){setTimeout(poll,2000)});
}

/* Ngat + quen mang dang dung. Bam 2 lan: lan dau hien canh bao, lan hai moi ngat */
function forget(ssid,btn){
 if(busy)return;
 var note=btn.parentNode.querySelector(".note");
 if(!btn.dataset.armed){
  btn.dataset.armed="1";btn.textContent="Bấm lần nữa để ngắt";
  var o=cur&&cur.other;
  note.className="note w";
  note.textContent=o?"Tủ sẽ chuyển sang "+(OTHER[o]||o)+", kết nối máy chủ gián đoạn vài giây.":"Tủ KHÔNG còn mạng nào khác (dây mạng / 4G): sẽ mất kết nối máy chủ, ngừng nhận khách cho tới khi có mạng lại.";
  clearTimeout(btn.t);btn.t=setTimeout(function(){delete btn.dataset.armed;btn.textContent="Ngắt kết nối"},6000);
  return;
 }
 clearTimeout(btn.t);delete btn.dataset.armed;
 busy=true;btn.disabled=true;btn.innerHTML='<span class="spin"></span>&nbsp; Đang ngắt…';
 var t0=Date.now();
 function done(){busy=false;btn.disabled=false;btn.textContent="Ngắt kết nối"}
 function poll(){
  api("/api/status").then(function(s){
   showSt(s);
   if(!(s.connected&&s.ssid==ssid)){
    done();
    var n=s.net&&s.net!="none"?NET[s.net]||s.net:"";
    msg(n?"ok":"err","Đã ngắt WiFi “"+ssid+"”",n?"Tủ đang dùng "+n+(s.server?", đã kết nối máy chủ.":", đang kết nối lại máy chủ…"):"Tủ hiện không có mạng. Chọn một mạng WiFi bên dưới để kết nối lại.");
    scan();return}
   next();
  }).catch(next);
 }
 function next(){if(Date.now()-t0>15000){done();msg("err","Chưa ngắt được","Thử lại sau vài giây.");return}setTimeout(poll,1000)}
 api("/api/forget",{ssid:ssid}).then(function(r){if(r&&r.ok===false){done();msg("err","Không ngắt được",r.msg||"");return}setTimeout(poll,1000)}).catch(function(){setTimeout(poll,1000)});
}

/* ---------- su kien ---------- */
document.addEventListener("click",function(e){
 var eye=e.target.closest(".eye");
 if(eye){var f=$(eye.dataset.for);f.type=f.type=="password"?"text":"password";eye.textContent=f.type=="password"?"Hiện":"Ẩn";return}
 var row=e.target.closest(".row");
 if(row){var li=row.parentNode,was=li.classList.contains("open");
  [].forEach.call(document.querySelectorAll("#list li.open"),function(x){x.classList.remove("open")});
  if(!was){li.classList.add("open");var inp=li.querySelector("input");if(inp)inp.focus()}clr();return}
 var off=e.target.closest(".off");
 if(off){forget($("list").L[+off.closest("li").dataset.i].ssid,off);return}
 var go=e.target.closest(".go");
 if(go){var li2=go.closest("li"),a=$("list").L[+li2.dataset.i],p=li2.querySelector("input");connect(a.ssid,p?p.value:"",go)}
});
document.addEventListener("keydown",function(e){
 if(e.key!="Enter"||e.target.tagName!="INPUT")return;
 var li=e.target.closest("li"),g=li&&li.querySelector(".go");if(li){if(g)g.click()}else $("h-go").click();
});
$("scan").onclick=scan;
$("h-go").onclick=function(){connect($("h-ssid").value.trim(),$("h-pw").value,this)};

/* ---------- khoi dong: khong goi duoc /api -> che do xem thu ---------- */
api("/api/status").then(showSt).catch(function(){DEMO=true;$("demo").style.display="block";return api("/api/status").then(showSt)}).then(scan);
setInterval(function(){if(!busy)api("/api/status").then(showSt).catch(function(){})},5000);
})();
</script>
</body>
</html>
